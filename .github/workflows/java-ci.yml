name: Employee Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Build WAR
        run: mvn --batch-mode clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeManagement-WAR
          path: target/*.war